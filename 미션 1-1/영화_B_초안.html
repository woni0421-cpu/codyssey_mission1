<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 영화 티어리스트</title>
    <style>
        :root {
            --bg-color: #141414;
            --text-color: #ffffff;
            --tier-s: #ff7f7f;
            --tier-a: #ffbf7f;
            --tier-b: #ffff7f;
            --tier-c: #7fff7f;
            --tier-d: #7fbfff;
            --tier-e: #bf7fff;
            --modal-bg: rgba(0, 0, 0, 0.8);
            --card-bg: #2b2b2b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 50px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #000;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #e50914;
            cursor: pointer;
        }

        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        input[type="text"] {
            padding: 8px 15px;
            border-radius: 20px;
            border: none;
            outline: none;
            background-color: #333;
            color: white;
        }

        button {
            padding: 8px 15px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            background-color: #e50914;
            color: white;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background-color: #b20710;
        }

        .btn-secondary {
            background-color: #333;
        }
        .btn-secondary:hover {
            background-color: #555;
        }

        /* Tier List Board */
        .tier-board {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
            background-color: #000;
            border: 2px solid #333;
            border-radius: 10px;
            overflow: hidden;
        }

        .tier-row {
            display: flex;
            min-height: 120px;
            border-bottom: 2px solid #333;
        }
        .tier-row:last-child {
            border-bottom: none;
        }

        .tier-label {
            width: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            color: #000;
            flex-shrink: 0;
            border-right: 2px solid #333;
        }

        .tier-content {
            display: flex;
            flex-wrap: wrap;
            padding: 10px;
            gap: 10px;
            flex-grow: 1;
            background-color: #1a1a1a;
        }

        /* Colors for Tiers */
        .label-s { background-color: var(--tier-s); }
        .label-a { background-color: var(--tier-a); }
        .label-b { background-color: var(--tier-b); }
        .label-c { background-color: var(--tier-c); }
        .label-d { background-color: var(--tier-d); }
        .label-e { background-color: var(--tier-e); }

        /* Movie Item */
        .movie-item {
            width: 70px;
            height: 100px;
            background-color: #444;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }
        .movie-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .movie-item .tooltip {
            position: absolute;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            width: 100%;
            font-size: 10px;
            text-align: center;
            padding: 2px;
            display: none;
        }
        .movie-item:hover .tooltip {
            display: block;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--modal-bg);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            color: white;
            font-size: 20px;
            padding: 0;
        }

        /* Search Results */
        .search-result-item {
            display: flex;
            gap: 15px;
            padding: 10px;
            border-bottom: 1px solid #444;
            cursor: pointer;
        }
        .search-result-item:hover {
            background-color: #333;
        }
        .search-result-item img {
            width: 50px;
            height: 75px;
            object-fit: cover;
        }

        /* Rating Form */
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }
        .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            background-color: #111;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
        }
        .form-group textarea {
            resize: none;
            height: 80px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Recommendations */
        .recommendations {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .recommendations h2 {
            margin-bottom: 15px;
        }
        .rec-list {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .rec-card {
            min-width: 120px;
            background: #222;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .rec-card img {
            width: 100px;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }

        /* Utility */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">MovieTier</div>
        <div class="header-controls">
            <input type="text" id="searchInput" placeholder="영화 검색 (예: 인셉션)">
            <button id="searchBtn">검색</button>
            
            <div id="userMenu" class="hidden">
                <label style="font-size: 12px; margin-right: 10px;">
                    <input type="checkbox" id="privacyToggle"> 비공개
                </label>
                <button class="btn-secondary" onclick="alert('티어리스트 링크가 클립보드에 복사되었습니다!')">공유</button>
                <button class="btn-secondary" onclick="alert('팔로우 기능은 준비 중입니다.')">팔로우</button>
                <button id="logoutBtn" class="btn-secondary">로그아웃</button>
            </div>
            <button id="loginBtn">소셜 로그인</button>
        </div>
    </header>

    <!-- Tier List Board -->
    <main class="tier-board">
        <div class="tier-row">
            <div class="tier-label label-s">S</div>
            <div class="tier-content" id="tier-S"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label label-a">A</div>
            <div class="tier-content" id="tier-A"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label label-b">B</div>
            <div class="tier-content" id="tier-B"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label label-c">C</div>
            <div class="tier-content" id="tier-C"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label label-d">D</div>
            <div class="tier-content" id="tier-D"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label label-e">E</div>
            <div class="tier-content" id="tier-E"></div>
        </div>
    </main>

    <!-- Recommendations -->
    <section class="recommendations hidden" id="recSection">
        <h2>취향 저격 추천 영화</h2>
        <div class="rec-list" id="recList">
            <!-- 추천 영화 렌더링 -->
        </div>
    </section>

    <!-- Search Modal -->
    <div class="modal" id="searchModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>검색 결과</h3>
                <button class="close-btn" onclick="closeModal('searchModal')">✕</button>
            </div>
            <div id="searchResults">
                <!-- 검색 결과 렌더링 -->
            </div>
        </div>
    </div>

    <!-- Rating Modal -->
    <div class="modal" id="ratingModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalMovieTitle">영화 제목</h3>
                <button class="close-btn" onclick="closeModal('ratingModal')">✕</button>
            </div>
            
            <div class="form-group">
                <label>별점 (5점 만점)</label>
                <select id="movieRating">
                    <option value="5">5.0 (S티어)</option>
                    <option value="4.5">4.5 (A티어)</option>
                    <option value="4">4.0 (A티어)</option>
                    <option value="3.5">3.5 (B티어)</option>
                    <option value="3">3.0 (B티어)</option>
                    <option value="2.5">2.5 (C티어)</option>
                    <option value="2">2.0 (C티어)</option>
                    <option value="1.5">1.5 (D티어)</option>
                    <option value="1">1.0 (D티어)</option>
                    <option value="0.5">0.5 (E티어)</option>
                    <option value="0">0.0 (E티어)</option>
                </select>
            </div>

            <div class="form-group">
                <label>한줄평</label>
                <textarea id="movieReview" placeholder="영화에 대한 짧은 감상을 남겨주세요."></textarea>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="movieWatched" checked>
                <label for="movieWatched" style="margin:0;">감상 완료</label>
            </div>

            <button style="width: 100%; margin-top: 10px;" onclick="saveRating()">기록 저장하기</button>
        </div>
    </div>

    <script>
        // --- 가상 데이터 (TMDB API 대체용) ---
        const mockMovies = [
            { id: 1, title: "인셉션", genre: "SF", date: "2010-07-21", poster: "https://placehold.co/100x150/1a1a1a/FFF?text=Inception" },
            { id: 2, title: "인터스텔라", genre: "SF", date: "2014-11-06", poster: "https://placehold.co/100x150/1a1a1a/FFF?text=Interstellar" },
            { id: 3, title: "기생충", genre: "스릴러", date: "2019-05-30", poster: "https://placehold.co/100x150/1a1a1a/FFF?text=Parasite" },
            { id: 4, title: "어벤져스: 엔드게임", genre: "액션", date: "2019-04-24", poster: "https://placehold.co/100x150/1a1a1a/FFF?text=Avengers" },
            { id: 5, title: "라라랜드", genre: "로맨스", date: "2016-12-07", poster: "https://placehold.co/100x150/1a1a1a/FFF?text=LaLaLand" },
            { id: 6, title: "범죄도시", genre: "액션", date: "2017-10-03", poster: "https://placehold.co/100x150/1a1a1a/FFF?text=Outlaws" },
            { id: 7, title: "매트릭스", genre: "SF", date: "1999-05-15", poster: "https://placehold.co/100x150/1a1a1a/FFF?text=Matrix" }
        ];

        // --- 상태 관리 ---
        let isLoggedIn = false;
        let myTierList = []; // 사용자가 평가한 영화 목록
        let selectedMovie = null; // 현재 평가 중인 영화

        // --- DOM 요소 ---
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userMenu = document.getElementById('userMenu');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const recSection = document.getElementById('recSection');

        // --- 이벤트 리스너 ---
        
        // 1. 로그인/로그아웃 (가상 소셜 로그인)
        loginBtn.addEventListener('click', () => {
            // 실제 구현 시 카카오/구글 OAuth 연동
            alert('구글/카카오 소셜 로그인 성공! (가상)');
            isLoggedIn = true;
            loginBtn.classList.add('hidden');
            userMenu.classList.remove('hidden');
            recSection.classList.remove('hidden');
        });

        logoutBtn.addEventListener('click', () => {
            isLoggedIn = false;
            loginBtn.classList.remove('hidden');
            userMenu.classList.add('hidden');
            recSection.classList.add('hidden');
            myTierList = [];
            renderTierList();
        });

        // 2. 영화 검색
        searchBtn.addEventListener('click', () => {
            if (!isLoggedIn) {
                alert('로그인 후 이용해주세요.');
                return;
            }
            const query = searchInput.value.trim();
            if (!query) return;

            // 가상 검색 로직 (실제로는 fetch('TMDB_URL') 사용)
            const results = mockMovies.filter(m => m.title.includes(query));
            showSearchResults(results);
        });

        // 엔터키 검색 지원
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchBtn.click();
        });

        // --- 핵심 함수 ---

        // 모달 열기/닫기
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // 검색 결과 화면 표시
        function showSearchResults(results) {
            const container = document.getElementById('searchResults');
            container.innerHTML = '';

            if (results.length === 0) {
                container.innerHTML = '<p style="color:#aaa; text-align:center;">검색 결과가 없습니다.</p>';
            } else {
                results.forEach(movie => {
                    const div = document.createElement('div');
                    div.className = 'search-result-item';
                    div.innerHTML = `
                        <img src="${movie.poster}" alt="${movie.title}">
                        <div>
                            <h4>${movie.title}</h4>
                            <p style="font-size:12px; color:#aaa;">${movie.genre} | ${movie.date}</p>
                        </div>
                    `;
                    div.onclick = () => openRatingModal(movie);
                    container.appendChild(div);
                });
            }
            openModal('searchModal');
        }

        // 평가 모달 열기
        function openRatingModal(movie) {
            selectedMovie = movie;
            document.getElementById('modalMovieTitle').innerText = movie.title;
            document.getElementById('movieRating').value = "5";
            document.getElementById('movieReview').value = "";
            document.getElementById('movieWatched').checked = true;
            
            closeModal('searchModal');
            openModal('ratingModal');
        }

        // 티어 계산 로직 (기획서 기준: 내림 처리)
        function calculateTier(rating) {
            const r = parseFloat(rating);
            if (r === 5) return 'S';
            if (r >= 4) return 'A';
            if (r >= 3) return 'B';
            if (r >= 2) return 'C';
            if (r >= 1) return 'D';
            return 'E';
        }

        // 기록 저장
        function saveRating() {
            const rating = document.getElementById('movieRating').value;
            const review = document.getElementById('movieReview').value;
            const watched = document.getElementById('movieWatched').checked;
            const tier = calculateTier(rating);

            // 기존에 평가한 영화면 제거 후 업데이트
            myTierList = myTierList.filter(m => m.id !== selectedMovie.id);
            
            myTierList.push({
                ...selectedMovie,
                rating: rating,
                review: review,
                watched: watched,
                tier: tier
            });

            closeModal('ratingModal');
            searchInput.value = '';
            renderTierList();
            updateRecommendations();
        }

        // 티어리스트 화면 렌더링
        function renderTierList() {
            // 초기화
            ['S', 'A', 'B', 'C', 'D', 'E'].forEach(t => {
                document.getElementById(`tier-${t}`).innerHTML = '';
            });

            // 배치
            myTierList.forEach(movie => {
                const div = document.createElement('div');
                div.className = 'movie-item';
                div.innerHTML = `
                    <img src="${movie.poster}" alt="${movie.title}">
                    <div class="tooltip">${movie.title}<br>⭐${movie.rating}</div>
                `;
                // 클릭 시 수정 가능하도록
                div.onclick = () => openRatingModal(movie);
                document.getElementById(`tier-${movie.tier}`).appendChild(div);
            });
        }

        // 장르 기반 추천 로직 (가상)
        function updateRecommendations() {
            const recList = document.getElementById('recList');
            recList.innerHTML = '';

            // 4점 이상 준 영화의 장르 수집
            const favoriteGenres = myTierList
                .filter(m => parseFloat(m.rating) >= 4)
                .map(m => m.genre);

            if (favoriteGenres.length === 0) {
                recList.innerHTML = '<p style="color:#aaa;">4점 이상 평가한 영화가 생기면 추천해 드립니다!</p>';
                return;
            }

            // 내가 평가하지 않은 영화 중 선호 장르와 일치하는 영화 찾기
            const recommended = mockMovies.filter(m => 
                favoriteGenres.includes(m.genre) && 
                !myTierList.find(my => my.id === m.id)
            );

            if (recommended.length === 0) {
                recList.innerHTML = '<p style="color:#aaa;">현재 추천할 영화가 없습니다.</p>';
                return;
            }

            // 추천 영화 렌더링
            recommended.forEach(movie => {
                const div = document.createElement('div');
                div.className = 'rec-card';
                div.innerHTML = `
                    <img src="${movie.poster}" alt="${movie.title}">
                    <h4 style="font-size:14px; margin-top:5px;">${movie.title}</h4>
                    <p style="font-size:12px; color:#aaa;">${movie.genre}</p>
                `;
                recList.appendChild(div);
            });
        }
    </script>
</body>
</html>
