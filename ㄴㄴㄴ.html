<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>건물 주민 커뮤니티</title>
<style>
  .screen { display: none; }
  .screen.active { display: block; }
</style>
</head>
<body>

<!-- 각 화면은 div.screen 하나로 표현. active 클래스가 붙은 것만 보임 -->
<div id="authScreen"     class="screen active"><h2>위치 인증</h2></div>
<div id="homeScreen"     class="screen"><h2>홈</h2></div>
<div id="categoryList"   class="screen"><h2>카테고리 목록</h2></div>
<div id="categoryPosts"  class="screen"><h2>카테고리별 글</h2></div>
<div id="writeScreen"    class="screen"><h2>글쓰기</h2></div>
<div id="detailScreen"   class="screen"><h2>게시글 상세</h2></div>
<div id="chatListScreen" class="screen"><h2>채팅 목록</h2></div>
<div id="chatRoomScreen" class="screen"><h2>1:1 채팅</h2></div>
<div id="myPage"         class="screen"><h2>마이페이지</h2></div>
<div id="reportScreen"   class="screen"><h2>신고</h2></div>

<script>
/* ===== 1. 데이터 구조 (기획서의 "필요한 자료" 그대로) ===== */
const CATEGORIES = ["자유게시판","분실물","장터/나눔","빌려주세요","공동구매","배달 같이하기","층간소음"];
const NO_ANON_CATEGORIES = ["장터/나눔"];  // 익명 불가 카테고리

let DB = JSON.parse(localStorage.getItem("communityDB")) || {
  users:    [],   // {id, nickname, verified, building, sanction}
  posts:    [],   // {id, category, title, body, authorId, anon, createdAt, updatedAt, deleted, reportCount}
  comments: [],   // {id, postId, authorId, content, anon, parentId, createdAt, updatedAt, deleted, reportCount}
  chats:    [],   // {id, postId, authorId, requesterId, messages:[...]}
  reports:  [],   // {id, targetType, targetId, reporterId, reason, detail, createdAt, status}
  seq: { post:1, comment:1, chat:1, report:1 }
};
function save() { localStorage.setItem("communityDB", JSON.stringify(DB)); }

/* ===== 2. 전역 상태 ===== */
let currentUser  = null;  // 인증된 사용자
let currentPostId = null; // 보고 있는 글
let currentChatId = null; // 보고 있는 채팅방

/* ===== 3. 화면 전환 (라우팅) ===== */
function go(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ===== 4. 앞으로 채울 기능들 (자리만 잡음) =====
   [1] verifyLocation()   : 위치 인증
   [2] renderHome()       : 홈 최신글 목록
   [3] openCategory(cat)  : 카테고리별 목록
   [4] submitPost()       : 글쓰기 (+ 장터 익명 금지 규칙)
   [5] openDetail(id)     : 상세 + 수정/삭제/신고/채팅버튼
   [6] 댓글/대댓글        : submitComment() 등
   [7] 채팅               : requestChat(), sendMessage()
   [8] 신고               : openReport(), submitReport()
   [9] 마이페이지         : renderMyPage(), logout()
=============================================================== */

/* XSS 방지용 공통 함수 (미리 준비) */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
</body>
</html>
